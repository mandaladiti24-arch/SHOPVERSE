
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopVerse | Online Shopping</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #111111;
    color: #fcf5f5;
}

/* NAVBAR */

.navbar {
    background: rgb(12, 12, 12);
    min-height: 85px;
    padding: 15px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    border-radius: 0 0 12px 12px;
    margin: 0 10px 12px;
}

.logo {
    color: #fae900;
    font-size: 25px;
    font-weight: bold;
    text-decoration: none;
}

.search {
    display: flex;
    width: 42%;
    min-width: 180px;
}

.search input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 6px 0 0 6px;
    font-size: 14px;
}

.search button {
    background: #2864e8;
    color: rgb(241, 237, 237);
    border: none;
    padding: 12px 22px;
    cursor: pointer;
    border-radius: 0 6px 6px 0;
}

.nav-links {
    display: flex;
    gap: 20px;
}

.nav-links a {
    text-decoration: none;
    color: rgb(250, 247, 247);
    font-weight: 500;
}

.nav-links a:hover {
    color: #fc0202;
}

/* MAIN LAYOUT */

.container {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 12px;
    margin: 0 10px;
    min-height: 68vh;
}

/* SIDEBAR */

.sidebar {
    background: rgb(51, 1, 1);
    border-radius: 12px;
    padding: 25px;
}

.sidebar h3 {
    margin-bottom: 15px;
}

.sidebar h4 {
    margin: 20px 0 10px;
    color: #f5f1f1;
    font-size: 26px;
}

.sidebar label {
    display: block;
    margin: 12px 0;
    cursor: pointer;
}

.sidebar input {
    margin-right: 5px;
    accent-color: #ff0000;
}

/* PRODUCTS SECTION */

.content {
    background: rgb(8, 8, 8);
    padding: 25px;
    border-radius: 12px;
    min-width: 0;
}

.content h2 {
    margin-bottom: 17px;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 15px;
}

.product {
    border: 1px solid #dce0e6;
    border-radius: 9px;
    padding: 12px;
    transition: 0.3s;
    cursor: pointer;
}

.product:hover {
    transform: translateY(-5px);
    box-shadow: 0 5px 15px #00000015;
}

.product img {
    width: 100%;
    height: 160px;
    object-fit: contain;
    background: #f0f1f4;
    border-radius: 6px;
    cursor: pointer;
}

.product h3 {
    font-size: 16px;
    margin: 13px 0 8px;
}

.price {
    color: #ff0202;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

.product button,
.primary-btn {
    background: #9b3e00;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 11px;
    width: 100%;
    cursor: pointer;
    font-weight: bold;
}

.product button:hover,
.primary-btn:hover {
    background: #220401;
}

/* FOOTER */

footer {
    background: rgb(14, 13, 13);
    margin: 12px 10px 0;
    padding: 20px 25px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 15px;
    color: #fdfdfd;
}

footer a {
    text-decoration: none;
    color: #65738a;
    margin-left: 15px;
}

/* INNER PAGES */

.page {
    background: rgb(10, 10, 10);
    margin: 15px 10px;
    padding: 30px;
    min-height: 65vh;
    border-radius: 12px;
}

.page h1 {
    margin-bottom: 20px;
    color: #2864e8;
}

.page p {
    line-height: 1.8;
    margin-bottom: 15px;
}

.detail-layout {
    display: flex;
    gap: 35px;
    flex-wrap: wrap;
    align-items: center;
}

.detail-layout img {
    width: 320px;
    max-width: 100%;
    height: 300px;
    object-fit: contain;
    background: #f0f1f4;
    border-radius: 10px;
}

.detail-info {
    flex: 1;
    min-width: 220px;
}

.detail-info h2 {
    margin-bottom: 15px;
}

.detail-info .price {
    font-size: 25px;
    margin: 20px 0;
}

.detail-info button {
    max-width: 250px;
    margin-top: 10px;
}

.back {
    display: inline-block;
    color: #2864e8;
    margin-bottom: 25px;
    text-decoration: none;
}

.empty {
    padding: 30px 0;
    color: #777;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    border-bottom: 1px solid #ddd;
    padding: 15px 0;
    flex-wrap: wrap;
}

.cart-item button {
    padding: 6px 12px;
    cursor: pointer;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 10px;
}

.total {
    font-size: 22px;
    font-weight: bold;
    margin: 25px 0;
}

/* RESPONSIVE DESIGN */

@media(max-width: 1000px) {
    .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media(max-width: 650px) {
    .navbar {
        flex-wrap: wrap;
        padding: 15px;
    }

    .logo {
        font-size: 22px;
    }

    .search {
        order: 3;
        width: 100%;
    }

    .nav-links {
        gap: 12px;
        font-size: 14px;
    }

    .container {
        grid-template-columns: 1fr;
    }

    .sidebar {
        padding: 18px;
    }

    .sidebar label {
        display: inline-block;
        margin-right: 12px;
    }

    .content {
        padding: 15px;
    }

    .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .product img {
        height: 120px;
    }

    .product h3 {
        font-size: 14px;
    }

    footer {
        flex-direction: column;
    }

    footer a {
        margin: 0 10px 0 0;
    }

    .page {
        padding: 20px;
    }

    .detail-layout img {
        width: 100%;
    }
}

@media(max-width: 350px) {
    .product-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->

<header class="navbar">

<a href="amazon-replica.html" class="logo">ShopVerse</a>

<form class="search" onsubmit="searchProducts(event)">
    <input type="text" id="searchInput"
    placeholder="Search for products...">
    <button type="submit">Search</button>
</form>

<nav class="nav-links">
    <a href="?page=account">Account</a>
    <a href="?page=cart">Cart (<span id="cartCount">0</span>)</a>
</nav>

</header>

<!-- PAGE CONTENT -->

<div id="app"></div>

<!-- FOOTER -->

<footer>
    <p>© 2026 ShopVerse Inc. All rights reserved.</p>

    <div>
        <a href="?page=privacy">Privacy Policy</a>
        <a href="?page=terms">Terms of Service</a>
        <a href="?page=contact">Contact Us</a>
    </div>
</footer>

<script>

/* PRODUCT DATABASE */

const products = [
{
id: 1,
name: "Wireless Headphones",
price: 20.11,
category: "Electronics",
image:"headphones.jfif",
description: "Experience high-quality sound with comfortable wireless headphones."
},
{
id: 2,
name: "Smartwatch Series 5",
price: 149.99,
category: "Electronics",
image: "smarrtwatch.jfif",
description: "Track your fitness, monitor your activity and stay connected."
},
{
id: 3,
name: "Ergonomic Mouse",
price: 29.99,
category: "Electronics",
image: "mouse.jfif",
description: "A comfortable and stylish mouse for everyday productivity."
},
{
id: 4,
name: "Mechanical Keyboard",
price: 79.99,
category: "Electronics",
image: "keyboard.jpg",
description: "A mechanical keyboard designed for smooth typing and gaming."
},
{
id: 5,
name: "Casual T-Shirt",
price: 25.99,
category: "Apparel",
image: "shirt.jfif",
description: "A comfortable everyday T-shirt."
},
{
id: 6,
name: "Running Shoes",
price: 89.99,
category: "Apparel",
image: "shoe.jfif",
description: "Lightweight shoes for everyday activities."
},
{
id: 7,
name: "Coffee Maker",
price: 45.99,
category: "Home & Kitchen",
image: "COFFFEE.jfif",
description: "Make your favourite coffee right at home."
},
{
id: 8,
name: "Table Lamp",
price: 35.99,
category: "Home & Kitchen",
image: "lamp.jpg",
description: "A beautiful lamp for your home and workspace."
}
];

/* CART */

let cart = JSON.parse(localStorage.getItem("shopCart")) || [];

function saveCart() {
    localStorage.setItem("shopCart", JSON.stringify(cart));
    updateCartCount();
}

function updateCartCount() {
    document.getElementById("cartCount").textContent =
    cart.reduce((sum, item) => sum + item.quantity, 0);
}

function addToCart(id) {
    const item = cart.find(p => p.id === id);

    if(item) {
        item.quantity++;
    } else {
        cart.push({id: id, quantity: 1});
    }

    saveCart();
    alert("Product added to your cart!");
}

/* NAVIGATION */

function goTo(url) {
    window.location.href = url;
}

function productPage(id) {
    goTo("?page=product&id=" + id);
}

/* PRODUCT CARD */

function productCard(p) {
    return `
    <div class="product">

        <img src="${p.image}"
        alt="${p.name}"
        onclick="productPage(${p.id})"
        onerror="this.alt='Add your product image';">

        <h3 onclick="productPage(${p.id})">${p.name}</h3>

        <div class="price">$${p.price.toFixed(2)}</div>

        <button onclick="addToCart(${p.id})">
        Add to Cart
        </button>

    </div>`;
}

/* HOMEPAGE */

function homePage(list = products) {

    document.getElementById("app").innerHTML = `

    <div class="container">

        <aside class="sidebar">

            <h3>Filters</h3>

            <h4>Category</h4>

            <label>
            <input type="checkbox" value="Electronics"
            onchange="applyFilters()"> Electronics
            </label>

            <label>
            <input type="checkbox" value="Apparel"
            onchange="applyFilters()"> Apparel
            </label>

            <label>
            <input type="checkbox" value="Home & Kitchen"
            onchange="applyFilters()"> Home & Kitchen
            </label>

            <h4>Price Range</h4>

            <label>
            <input type="radio" name="price" value="50"
            onchange="applyFilters()"> Under $50
            </label>

            <label>
            <input type="radio" name="price" value="100"
            onchange="applyFilters()"> $50 - $100
            </label>

            <label>
            <input type="radio" name="price" value="101"
            onchange="applyFilters()"> $100+
            </label>

            <label>
            <input type="radio" name="price" value="all"
            onchange="applyFilters()" checked> All Prices
            </label>

            <br><br>
            <a href="amazon-replica.html"
            style="color:#2864e8;">Clear Filters</a>

        </aside>

        <main class="content">

            <h2>Featured Products</h2>

            <div class="product-grid" id="productGrid">
                ${list.map(productCard).join("")}
            </div>

            ${list.length === 0 ?
            '<p class="empty">No products found!</p>' : ''}

        </main>

    </div>`;
}

/* FILTERS */

function applyFilters() {

    const categories = [...document.querySelectorAll(
        '.sidebar input[type="checkbox"]:checked'
    )].map(input => input.value);

    const price = document.querySelector(
        '.sidebar input[name="price"]:checked'
    ).value;

    let filtered = products.filter(p => {

        const categoryMatch =
        categories.length === 0 || categories.includes(p.category);

        let priceMatch = true;

        if(price === "50") priceMatch = p.price < 50;
        if(price === "100") priceMatch = p.price >= 50 && p.price <= 100;
        if(price === "101") priceMatch = p.price > 100;

        return categoryMatch && priceMatch;
    });

    document.getElementById("productGrid").innerHTML =
    filtered.map(productCard).join("");

    if(filtered.length === 0) {
        document.getElementById("productGrid").innerHTML =
        "<p>No products found!</p>";
    }
}

/* SEARCH */

function searchProducts(event) {

    event.preventDefault();

    const value = document.getElementById("searchInput")
    .value.toLowerCase().trim();

    const results = products.filter(p =>
        p.name.toLowerCase().includes(value) ||
        p.category.toLowerCase().includes(value)
    );

    homePage(results);
}

/* PRODUCT DETAILS PAGE */

function showProduct(id) {

    const p = products.find(item => item.id === id);

    if(!p) {
        document.getElementById("app").innerHTML =
        '<div class="page"><h1> SOOOORRYY Product not found</h1></div>';
        return;
    }

    document.getElementById("app").innerHTML = `

    <div class="page">

        <a class="back" href="amazon-replica.html">
        ← Back to Shopping
        </a>

        <div class="detail-layout">

            <img src="${p.image}" alt="${p.name}">

            <div class="detail-info">

                <h2>${p.name}</h2>

                <p>Category: ${p.category}</p>

                <div class="price">
                $${p.price.toFixed(2)}
                </div>

                <p>${p.description}</p>

                <button class="primary-btn"
                onclick="addToCart(${p.id})">
                Add to Cart
                </button>

            </div>

        </div>

    </div>`;
}

/* CATEGORY PAGE */

function categoryPage(name) {

    const list = products.filter(p => p.category === name);

    document.getElementById("app").innerHTML = `

    <div class="page">

        <a class="back" href="amazon-replica.html">
        ← Back to Home
        </a>

        <h1>${name}</h1>

        <div class="product-grid">
        ${list.map(productCard).join("")}
        </div>

    </div>`;
}

/* CART PAGE */

function cartPage() {

    const items = cart.map(item => ({
        ...products.find(p => p.id === item.id),
        quantity: item.quantity
    }));

    const total = items.reduce(
        (sum, item) => sum + item.price * item.quantity, 0
    );

    document.getElementById("app").innerHTML = `

    <div class="page">

        <a class="back" href="amazon-replica.html">
        ← Continue Shopping
        </a>

        <h1>Shopping Cart</h1>

        ${items.length === 0 ?
        '<p class="empty">Your cart is empty!</p>' :

        items.map(item => `

            <div class="cart-item">

                <div>
                    <h3>${item.name}</h3>
                    <p>$${item.price.toFixed(2)}</p>
                </div>

                <div class="quantity">

                    <button onclick="changeQuantity(${item.id},-1)">-</button>

                    ${item.quantity}

                    <button onclick="changeQuantity(${item.id},1)">+</button>

                    <button onclick="removeItem(${item.id})">
                    Remove
                    </button>

                </div>

            </div>

        `).join("")}

        ${items.length ? `
        <div class="total">
        Total: $${total.toFixed(2)}
        </div>
        <button class="primary-btn" onclick="alert('Checkout coming soon!')">
        Proceed to Checkout
        </button>` : ''}

    </div>`;
}

function changeQuantity(id, amount) {

    const item = cart.find(p => p.id === id);

    if(item) {
        item.quantity += amount;

        if(item.quantity <= 0) {
            cart = cart.filter(p => p.id !== id);
        }
    }

    saveCart();
    cartPage();
}

function removeItem(id) {
    cart = cart.filter(p => p.id !== id);
    saveCart();
    cartPage();
}

/* OTHER PAGES */

function otherPage(page) {

    const content = {

        account: `
        <h1>My Account</h1>
        <p>Welcome to ShopVerse!</p>
        <p>Account registration and login coming soon.</p>`,

        privacy: `
        <h1>Privacy Policy</h1>
        <p>We respect your privacy and value your trust.</p>
        <p>Your shopping information should always be protected.</p>`,

        terms: `
        <h1>Terms of Service</h1>
        <p>Welcome to ShopVerse.</p>
        <p>By using this website, you agree to our shopping terms and conditions.</p>`,

        contact: `
        <h1>Contact Us</h1>
        <p>Have any questions? We would love to hear from you!</p>
        <p>Email: support@shopverse.com</p>
        <p>Phone: +91 9876543210</p>`
    };

    document.getElementById("app").innerHTML = `
    <div class="page">
        <a class="back" href="amazon-replica.html">← Back to Home</a>
        ${content[page]}
    </div>`;
}

/* ROUTING */

function renderPage() {

    const params = new URLSearchParams(window.location.search);

    const page = params.get("page");

    if(!page) {
        homePage();
    }

    else if(page === "product") {
        showProduct(Number(params.get("id")));
    }

    else if(page === "category") {
        categoryPage(params.get("name"));
    }

    else if(page === "cart") {
        cartPage();
    }

    else {
        otherPage(page);
    }

    updateCartCount();
}

renderPage();

</script>

</body>
</html>
